name: Build MagicCursor.exe
on:
  workflow_dispatch:
    inputs:
      p1:
        description: part 1
        required: true
      p2:
        description: part 2
        required: false
        default: ""
      msix_name:
        description: Store Package/Identity/Name (Partner Center > Product identity)
        required: false
        default: "MagicCursor.Placeholder"
      msix_publisher:
        description: Store Package/Identity/Publisher (CN=...)
        required: false
        default: "CN=00000000-0000-0000-0000-000000000000"
      msix_publisher_name:
        description: Store Publisher display name
        required: false
        default: "Praveen Pedamallu"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack
        shell: python
        env:
          P1: ${{ inputs.p1 }}
          P2: ${{ inputs.p2 }}
        run: |
          import os, base64, lzma, re
          src = lzma.decompress(base64.b64decode(os.environ["P1"] + os.environ["P2"]))
          open("magic_cursor.pyw", "wb").write(src)
          v = re.search(rb"^VERSION\s*=\s*(\d+)", src, re.M).group(1).decode()
          open(os.environ["GITHUB_ENV"], "a").write("V=" + v + "\n")
          print("version", v)
      - name: Install tools
        run: python -m pip install -U pyinstaller google-genai mss pillow keyboard vosk sounddevice
      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name MagicCursor --icon MagicCursor.ico --collect-all vosk --collect-all sounddevice --collect-all _sounddevice_data magic_cursor.pyw
      - name: Remove source
        shell: bash
        run: rm -f magic_cursor.pyw MagicCursor.spec; rm -rf build
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" dist/MagicCursor.exe --title "Magic Cursor v$V" --notes "Magic Cursor for Windows 11, version $V. Created by Yathin Pedamallu."
      - name: Make Microsoft Store package (MSIX)
        continue-on-error: true
        shell: python
        env:
          MSIX_NAME: ${{ inputs.msix_name }}
          MSIX_PUB: ${{ inputs.msix_publisher }}
          MSIX_PUBNAME: ${{ inputs.msix_publisher_name }}
        run: |
          import os, shutil, glob, subprocess
          from xml.sax.saxutils import escape as e
          from PIL import Image
          v = os.environ["V"]
          root = "msix"
          os.makedirs(root + "/Assets", exist_ok=True)
          shutil.copy("dist/MagicCursor.exe", root + "/MagicCursor.exe")
          ico = Image.open("MagicCursor.ico")
          ico.size = max(ico.info["sizes"])
          big = ico.convert("RGBA")
          def square(name, n):
              big.resize((n, n), Image.LANCZOS).save(root + "/Assets/" + name)
          square("StoreLogo.png", 50)
          square("Square44x44Logo.png", 44)
          square("Square44x44Logo.targetsize-256_altform-unplated.png", 256)
          square("Square150x150Logo.png", 150)
          wide = Image.new("RGBA", (310, 150), (0, 0, 0, 0))
          wide.paste(big.resize((120, 120), Image.LANCZOS), (95, 15))
          wide.save(root + "/Assets/Wide310x150Logo.png")
          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
            xmlns:desktop="http://schemas.microsoft.com/appx/manifest/desktop/windows10"
            xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
            IgnorableNamespaces="uap desktop rescap">
            <Identity Name="{e(os.environ['MSIX_NAME'])}" Publisher="{e(os.environ['MSIX_PUB'])}" Version="1.{v}.0.0" ProcessorArchitecture="x64"/>
            <Properties>
              <DisplayName>Magic Cursor</DisplayName>
              <PublisherDisplayName>{e(os.environ['MSIX_PUBNAME'])}</PublisherDisplayName>
              <Logo>Assets\\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0"/>
            </Dependencies>
            <Resources><Resource Language="en-us"/></Resources>
            <Applications>
              <Application Id="MagicCursor" Executable="MagicCursor.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="Magic Cursor" Description="Select anything on your screen and ask Gemini about it."
                  BackgroundColor="transparent" Square150x150Logo="Assets\\Square150x150Logo.png" Square44x44Logo="Assets\\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\\Wide310x150Logo.png"/>
                </uap:VisualElements>
                <Extensions>
                  <desktop:Extension Category="windows.startupTask" Executable="MagicCursor.exe" EntryPoint="Windows.FullTrustApplication">
                    <desktop:StartupTask TaskId="MagicCursorStartup" Enabled="false" DisplayName="Magic Cursor"/>
                  </desktop:Extension>
                </Extensions>
              </Application>
            </Applications>
            <Capabilities>
              <Capability Name="internetClient"/>
              <rescap:Capability Name="runFullTrust"/>
              <DeviceCapability Name="microphone"/>
            </Capabilities>
          </Package>
          """
          open(root + "/AppxManifest.xml", "w", encoding="utf-8").write(manifest)
          tool = sorted(glob.glob(r"C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe"))[-1]
          subprocess.run([tool, "pack", "/d", root, "/p", "dist/MagicCursor-" + v + ".msix", "/o"], check=True)
      - name: Keep Store package (private, for Partner Center upload)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MagicCursor-msix
          path: dist/*.msix
